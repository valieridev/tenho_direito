<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="direitos, aluno, eleitor, quais meus direitos">
    <meta name="author" content="Primeiro ano de DS manha">
    <title>Tenho direito || Site informativo</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
</head>
<body>
    <header>
        <nav>
            <button><a href="">Acessar quiz avaliativo</a></button>
            <img src="assets/imgs/balancajustica.png" alt="">
            <ul>
                <li>Direitos</li>
                <li>Idades</li>
                <li>Fontes</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container-inicial">
            <div class="container-textos">
                <div class="container-titulo">
                    <h1>Descubra seus direitos como</h1>
                    <h2>aluno, cidadão e eleitor</h2>
                </div>
                <div class="container-paragrafo">
                    <p>Escolha uma tecla para ver o que a lei garante, onde isso está escrito e a quem recorrer quando um direito não for respeitado.</p>
                </div>
            </div>
            <div class="container-img">
                <img src="assets/imgs/livro.png" alt="">
            </div>
        </div>

        <div class="container-btns">
            <button id="btn-aluno">
                <h3>Aluno</h3>
                <p>Na escola, no técnico, na faculdade e no estágio</p>
            </button>
            <button id="btn-cidadao">
                <h3>Cidadão</h3>
                <p>Diante do governo, da polícia, das empresas e do trabalho</p>
            </button>
            <button id="btn-eleitor">
                <h3>Eleitor</h3>
                <p>Do título à urna, e de votar a ser votado</p>
            </button>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
